<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Food Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, #20233f 0%, rgba(32, 35, 63, 0) 60%),
                radial-gradient(1000px 600px at 100% 0%, #17203a 0%, rgba(23, 32, 58, 0) 55%),
                #0f1117;
            min-height: 100vh;
            padding: 24px;
            color: #e6e8ee;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 2rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f7f8fc;
            margin-bottom: 6px;
        }

        .header p {
            color: #97a0b5;
            font-size: 0.98rem;
        }

        .card {
            background: #171a22;
            border: 1px solid #2a3040;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 20px 35px rgba(3, 6, 12, 0.35);
        }

        .input-section {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid #30374a;
            background: #10131a;
            color: #e8ebf3;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder,
        .clarification-section input::placeholder {
            color: #6d7589;
        }

        textarea:focus {
            outline: none;
            border-color: #5c8dff;
            box-shadow: 0 0 0 3px rgba(92, 141, 255, 0.15);
        }

        .button {
            width: 100%;
            padding: 12px 14px;
            background: linear-gradient(180deg, #5d90ff 0%, #3f77f3 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
            margin-top: 12px;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(63, 119, 243, 0.35);
            filter: brightness(1.03);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .section-title {
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: #f4f6fb;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .food-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid #232838;
        }

        .food-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 10px;
        }

        .food-item:last-child {
            border-bottom: none;
        }

        .food-name {
            color: #f2f4fa;
            font-weight: 600;
            flex: 1;
        }

        .food-item-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }

        .delete-btn {
            background: transparent;
            color: #aeb6ca;
            border: 1px solid #333a4d;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .delete-btn:hover {
            border-color: #eb5b69;
            color: #ffd2d7;
            background: rgba(235, 91, 105, 0.08);
        }

        .food-details {
            flex: 1;
            cursor: pointer;
        }

        .food-details:hover .food-name {
            color: #ffffff;
        }

        .trace-toggle {
            font-size: 0.72rem;
            color: #8ba8ff;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .food-meta {
            font-size: 0.82rem;
            color: #99a2b7;
            margin-top: 6px;
            line-height: 1.45;
        }

        .entry-time {
            font-size: 0.73rem;
            color: #7f89a0;
            margin-bottom: 3px;
        }

        .confidence {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 7px;
            letter-spacing: 0.04em;
            border: 1px solid transparent;
        }

        .confidence.high {
            background: rgba(47, 196, 141, 0.16);
            border-color: rgba(47, 196, 141, 0.35);
            color: #8ce5bf;
        }

        .confidence.medium {
            background: rgba(255, 181, 72, 0.16);
            border-color: rgba(255, 181, 72, 0.35);
            color: #ffd49a;
        }

        .confidence.low {
            background: rgba(239, 91, 113, 0.16);
            border-color: rgba(239, 91, 113, 0.35);
            color: #ffb5c0;
        }

        .confidence.manual {
            background: rgba(152, 167, 198, 0.16);
            border-color: rgba(152, 167, 198, 0.35);
            color: #cfd7eb;
        }

        .source {
            font-size: 0.72rem;
            color: #7f89a0;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .macros {
            margin-top: 4px;
            font-size: 0.8rem;
        }

        .assumptions-toggle {
            margin-top: 6px;
            color: #82a7ff;
            cursor: pointer;
            font-size: 0.76rem;
            font-weight: 500;
        }

        .assumptions-panel {
            margin-top: 8px;
            padding: 10px;
            background: #10131a;
            border: 1px solid #2b3142;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #a8b1c8;
        }

        .assumptions-panel ul {
            margin: 0;
            padding-left: 16px;
        }

        .assumptions-panel li {
            margin-bottom: 4px;
        }

        .meal-badge {
            display: inline-block;
            padding: 3px 8px;
            background: #212636;
            border: 1px solid #31394d;
            border-radius: 999px;
            font-size: 0.73rem;
            font-weight: 600;
            margin-left: 10px;
            color: #adb6ca;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meal-badge.breakfast {
            border-color: rgba(255, 181, 72, 0.4);
            color: #ffd59f;
        }

        .meal-badge.lunch {
            border-color: rgba(95, 170, 255, 0.4);
            color: #abd3ff;
        }

        .meal-badge.dinner {
            border-color: rgba(213, 124, 255, 0.4);
            color: #e4beff;
        }

        .meal-badge.snack {
            border-color: rgba(47, 196, 141, 0.4);
            color: #a0ebca;
        }

        .calories {
            font-weight: 600;
            color: #8fb2ff;
            margin-left: 10px;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(140deg, #1f2638 0%, #171f31 100%);
            border: 1px solid #303853;
            border-radius: 12px;
            color: #e9edf8;
            margin-top: 20px;
        }

        .total-label {
            font-size: 0.95rem;
            color: #adb5c8;
        }

        .total-value {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #7d869d;
            border: 1px dashed #31384e;
            border-radius: 12px;
            background: #121520;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.35;
        }

        .status-message {
            padding: 10px 11px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.82rem;
            border: 1px solid transparent;
            display: none;
        }

        .status-message.success {
            background: rgba(47, 196, 141, 0.14);
            color: #a3ebcc;
            border-color: rgba(47, 196, 141, 0.28);
            display: block;
        }

        .status-message.error {
            background: rgba(239, 91, 113, 0.14);
            color: #ffb7c2;
            border-color: rgba(239, 91, 113, 0.28);
            display: block;
        }

        .status-message.info {
            background: rgba(95, 170, 255, 0.14);
            color: #b7d8ff;
            border-color: rgba(95, 170, 255, 0.28);
            display: block;
        }

        .clarification-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #2a3040;
        }

        .clarification-section h3 {
            color: #dfe6f8;
            margin-bottom: 10px;
        }

        .clarification-section p {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #aab3c8;
            font-weight: 500;
        }

        .clarification-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid #30374a;
            background: #10131a;
            color: #e8ebf3;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .clarification-section input:focus {
            outline: none;
            border-color: #5c8dff;
            box-shadow: 0 0 0 3px rgba(92, 141, 255, 0.15);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #151925;
            border: 1px solid #2a3040;
            border-radius: 12px;
            padding: 6px;
        }

        .tab {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            color: #9ca5ba;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .tab.active {
            background: #2f77ff;
            color: #ffffff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .summary-day {
            padding: 15px;
            background: #121520;
            border: 1px solid #2a3144;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .summary-day:hover {
            border-color: #4a5b85;
            background: #161b29;
        }

        .summary-date {
            font-weight: 600;
            color: #e3e7f3;
        }

        .summary-stats {
            text-align: right;
        }

        .summary-calories {
            font-size: 1.08rem;
            font-weight: 700;
            color: #8fb2ff;
        }

        .summary-count {
            font-size: 0.8rem;
            color: #939cb2;
        }

        .range-controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 14px;
            align-items: end;
        }

        .range-controls label {
            font-size: 0.76rem;
            color: #8f98ad;
            margin-bottom: 4px;
            display: block;
        }

        .range-controls input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30374a;
            background: #10131a;
            color: #e8ebf3;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .range-controls button {
            margin-top: 0;
            width: auto;
            padding: 10px 12px;
        }

        .date-details {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #2a3040;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #232838;
            font-size: 0.88rem;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trace-panel {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #2a3144;
            border-radius: 10px;
            background: #111522;
            display: none;
        }

        .trace-panel.visible {
            display: block;
        }

        .trace-section-title {
            font-size: 0.8rem;
            color: #a9b5cf;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .trace-block {
            background: #0d1017;
            border: 1px solid #252c3c;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            color: #c6cee3;
            font-size: 0.8rem;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .trace-candidate {
            padding: 8px 0;
            border-bottom: 1px solid #22293a;
            font-size: 0.8rem;
            color: #c7d0e6;
        }

        .trace-candidate:last-child {
            border-bottom: none;
        }

        .detail-food {
            color: #e6e9f3;
            font-weight: 500;
        }

        .detail-calories {
            color: #8fb2ff;
            font-weight: 600;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .card {
                padding: 16px;
            }

            .tabs {
                gap: 6px;
                padding: 5px;
            }

            .tab {
                font-size: 13px;
                padding: 9px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Food Journal</h1>
            <p>Natural logging with confidence-aware nutrition estimates.</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('log')">Log Food</button>
            <button class="tab" onclick="switchTab('today')">Today</button>
            <button class="tab" onclick="switchTab('summary')">Summary</button>
        </div>

        <!-- Log Food Tab -->
        <div id="log-tab" class="tab-content active">
            <div class="card">
                <h2 class="section-title">What did you eat?</h2>
                <div class="input-section">
                    <textarea 
                        id="food-input" 
                        placeholder="e.g., had oatmeal with banana for breakfast and a chicken sandwich for lunch"
                    ></textarea>
                    <button id="log-button" class="button" onclick="logFood()">Log Food</button>
                    <div id="log-status" class="status-message"></div>
                </div>
                <div id="clarification-card" class="clarification-section" style="display: none;">
                    <h3 class="section-title">Need More Details</h3>
                    <p id="clarification-question"></p>
                    <input type="text" id="clarification-answer" placeholder="Your answer..." />
                    <button id="clarify-button" class="button" onclick="submitClarification()">Continue</button>
                    <div id="clarify-status" class="status-message"></div>
                </div>
                <div id="manual-card" class="clarification-section" style="display: none;">
                    <h3 class="section-title">Manual Calorie Estimate</h3>
                    <p id="manual-prompt"></p>
                    <input type="number" id="manual-calories" placeholder="Estimated calories" min="1" />
                    <button id="manual-button" class="button" onclick="submitManualEstimate()">Save Estimate</button>
                    <div id="manual-status" class="status-message"></div>
                </div>
            </div>
        </div>

        <!-- Today Tab -->
        <div id="today-tab" class="tab-content">
            <div class="card">
                <h2 class="section-title">Today's Entries</h2>
                <div id="today-entries">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <p>No entries yet today</p>
                    </div>
                </div>
                <div id="today-total" style="display: none;">
                    <div class="total-section">
                        <span class="total-label">Total Calories</span>
                        <span class="total-value" id="total-calories">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Tab -->
        <div id="summary-tab" class="tab-content">
            <div class="card">
                <h2 class="section-title">7-Day Summary</h2>
                <div class="range-controls">
                    <div>
                        <label for="summary-start">Start</label>
                        <input type="date" id="summary-start" />
                    </div>
                    <div>
                        <label for="summary-end">End</label>
                        <input type="date" id="summary-end" />
                    </div>
                    <button class="button" onclick="applySummaryRange()">Apply</button>
                </div>
                <div id="summary-content">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <p>No data available</p>
                    </div>
                </div>
                <div id="summary-date-details" class="date-details" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // Get the API base URL (works for both localhost and network access)
        const API_BASE = window.location.origin;
        let selectedSummaryDate = null;

        // Switch between tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Load data for the tab
            if (tabName === 'today') {
                loadTodayEntries();
            } else if (tabName === 'summary') {
                loadSummary();
            }
        }

        function formatIsoDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatEntryTime(timestamp) {
            if (!timestamp) {
                return '';
            }
            const normalized = /Z$|[+-]\d\d:\d\d$/.test(timestamp) ? timestamp : `${timestamp}Z`;
            const date = new Date(normalized);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function formatNutrient(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) {
                return '0';
            }
            return num.toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2,
            });
        }

        function initializeSummaryDateRange() {
            const endInput = document.getElementById('summary-end');
            const startInput = document.getElementById('summary-start');
            const today = new Date();
            const weekAgo = new Date();
            weekAgo.setDate(today.getDate() - 6);

            endInput.value = formatIsoDate(today);
            startInput.value = formatIsoDate(weekAgo);
        }

        function setStatus(element, message, type = null) {
            if (!element) {
                return;
            }
            if (!message) {
                element.textContent = '';
                element.className = 'status-message';
                return;
            }
            element.textContent = message;
            element.className = `status-message ${type || ''}`.trim();
        }

        function showStatus(message, type = 'success') {
            setStatus(document.getElementById('log-status'), message, type);
        }

        function showClarificationCard(pendingEntry) {
            const card = document.getElementById('clarification-card');
            const question = document.getElementById('clarification-question');
            const answer = document.getElementById('clarification-answer');

            document.getElementById('manual-card').style.display = 'none';
            card.style.display = 'block';
            card.dataset.pendingId = pendingEntry.pending_id;
            question.textContent = pendingEntry.question || 'Please provide more details.';
            answer.value = '';
            setStatus(document.getElementById('clarify-status'), '');
            answer.focus();
        }

        function showManualCard(data) {
            const clarification = document.getElementById('clarification-card');
            const card = document.getElementById('manual-card');
            const prompt = document.getElementById('manual-prompt');
            const caloriesInput = document.getElementById('manual-calories');

            clarification.style.display = 'none';
            card.style.display = 'block';
            card.dataset.pendingId = data.pending_id;
            prompt.textContent = data.manual_prompt || 'Please enter your calorie estimate.';
            caloriesInput.value = '';
            setStatus(document.getElementById('manual-status'), '');
            caloriesInput.focus();
        }

        // Log food entry
        async function logFood() {
            const input = document.getElementById('food-input');
            const button = document.getElementById('log-button');
            const text = input.value.trim();

            if (button.disabled) {
                return;
            }

            if (!text) {
                showStatus('Please enter what you ate', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Logging...';
            showStatus('Submitting entry...', 'info');

            try {
                const response = await fetch(`${API_BASE}/log`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: text
                });

                if (!response.ok) {
                    throw new Error('Failed to log food');
                }

                const data = await response.json();
                
                if (data.status === 'needs_clarification') {
                    document.getElementById('manual-card').style.display = 'none';
                    showClarificationCard(data.pending_entries[0]); // Assume one for now
                    showStatus('Need a bit more detail to finish this entry.', 'info');
                } else {
                    showStatus(`✓ Logged ${data.foods_logged} item(s) successfully!`, 'success');
                    input.value = '';
                    // Auto-switch to today tab after successful log
                    setTimeout(() => {
                        document.querySelectorAll('.tab')[1].click();
                    }, 1000);
                }

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Log Food';
            }
        }

        // Load today's entries
        async function loadTodayEntries() {
            const container = document.getElementById('today-entries');
            const totalSection = document.getElementById('today-total');
            
            container.innerHTML = '<div class="empty-state"><p>Loading...</p></div>';

            try {
                const response = await fetch(`${API_BASE}/log/today`);
                const data = await response.json();

                if (data.entries.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                            <p>No entries yet today</p>
                        </div>
                    `;
                    totalSection.style.display = 'none';
                    return;
                }

                let html = '';
                data.entries.forEach(entry => {
                    const mealClass = entry.meal ? entry.meal.toLowerCase() : '';
                    const mealBadge = entry.meal ? `<span class="meal-badge ${mealClass}">${entry.meal}</span>` : '';
                    const calories = entry.calories ? `<span class="calories">${entry.calories} cal</span>` : '';
                    const confidence = entry.confidence_level ? `<span class="confidence ${entry.confidence_level}">${entry.confidence_level}</span>` : '';
                    const source = entry.source ? `<span class="source">${entry.source}</span>` : '';
                    const entryTime = formatEntryTime(entry.created_at);
                    const timeLine = entryTime ? `<div class="entry-time">${entryTime}</div>` : '';
                    const macros = entry.protein_g || entry.carbs_g || entry.fat_g ? 
                        `<div class="macros">Macros: Protein ${formatNutrient(entry.protein_g)}g | Carbs ${formatNutrient(entry.carbs_g)}g | Fat ${formatNutrient(entry.fat_g)}g</div>` : '';
                    const assumptions = entry.assumptions && entry.assumptions.length > 0 ? 
                        `<div class="assumptions-toggle" onclick="toggleAssumptions(this)">Why this estimate? ▼</div>
                         <div class="assumptions-panel" style="display: none;">
                             <ul>${entry.assumptions.map(a => `<li>${a}</li>`).join('')}</ul>
                         </div>` : '';
                    
                    html += `
                        <div class="food-item">
                            <div class="food-main">
                                <div class="food-details" onclick="toggleEntryTrace(${entry.id})">
                                    <div class="food-name">
                                        ${entry.food_name}
                                        ${mealBadge}
                                        ${confidence}
                                        ${source}
                                    </div>
                                    <div class="food-meta">
                                        ${timeLine}
                                        ${calories}
                                        ${macros}
                                        ${assumptions}
                                    </div>
                                    <div class="trace-toggle" id="trace-toggle-${entry.id}">Trace ▼</div>
                                </div>
                                <div class="food-item-info">
                                    <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                                </div>
                            </div>
                        </div>
                        <div id="trace-${entry.id}" class="trace-panel"></div>
                    `;
                });

                container.innerHTML = html;
                
                // Show total if we have calorie data
                if (data.total_calories > 0) {
                    document.getElementById('total-calories').textContent = data.total_calories;
                    totalSection.style.display = 'block';
                } else {
                    totalSection.style.display = 'none';
                }

            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>Error loading entries</p></div>`;
            }
        }

        async function toggleEntryTrace(entryId) {
            const panel = document.getElementById(`trace-${entryId}`);
            const toggle = document.getElementById(`trace-toggle-${entryId}`);
            if (!panel || !toggle) {
                return;
            }

            if (panel.classList.contains('visible')) {
                panel.classList.remove('visible');
                toggle.textContent = 'Trace ▼';
                return;
            }

            if (!panel.dataset.loaded) {
                panel.innerHTML = '<div class="trace-block">Loading trace...</div>';
                panel.classList.add('visible');
                toggle.textContent = 'Trace ▲';

                try {
                    const response = await fetch(`${API_BASE}/log/${entryId}/trace`);
                    if (!response.ok) {
                        throw new Error('Trace not available');
                    }

                    const data = await response.json();
                    const promptText = data.prompt_context?.raw_input_text || '—';
                    const parsedJson = JSON.stringify(data.response_context?.parsed_json || {}, null, 2);
                    const candidates = data.response_context?.candidates || [];

                    const candidatesHtml = candidates.length > 0
                        ? candidates.slice(0, 8).map(c => `
                            <div class="trace-candidate">
                                <strong>${c.name}</strong> (${c.source || 'unknown'})
                                <div>Score: ${(c.score ?? 0).toFixed ? c.score.toFixed(3) : c.score}</div>
                                <div>Calories: ${c.calories ?? '—'}</div>
                            </div>
                        `).join('')
                        : '<div class="trace-block">No candidate response data.</div>';

                    panel.innerHTML = `
                        <div class="trace-section-title">Original Journal Input</div>
                        <div class="trace-block">${promptText}</div>
                        <div class="trace-section-title">Parsed LLM Response</div>
                        <div class="trace-block">${parsedJson}</div>
                        <div class="trace-section-title">Candidate Responses</div>
                        ${candidatesHtml}
                    `;
                    panel.dataset.loaded = '1';
                } catch (error) {
                    panel.innerHTML = '<div class="trace-block">Could not load trace details for this entry.</div>';
                }
            } else {
                panel.classList.add('visible');
                toggle.textContent = 'Trace ▲';
            }
        }

        // Load 7-day summary
        async function loadSummary() {
            const container = document.getElementById('summary-content');
            const startInput = document.getElementById('summary-start');
            const endInput = document.getElementById('summary-end');
            
            container.innerHTML = '<div class="empty-state"><p>Loading...</p></div>';

                let query = '';

                    query = `?start_date=${encodeURIComponent(startInput.value)}&end_date=${encodeURIComponent(endInput.value)}`;
                }

                const response = await fetch(`${API_BASE}/log/summary${query}`);
                const data = await response.json();

                if (!data.summary || data.summary.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            </svg>
                            <p>No data available</p>
                        </div>
                    `;

                }

                let html = '';
                data.summary.forEach(day => {
                    const calories = day.total_calories || '—';

                            <div class="summary-stats">

                                <div class="summary-count">${day.entry_count} entries</div>

                        </div>
                    `;
                });

                container.innerHTML = html;
                
                // Show total if we have calorie data
                if (data.total_calories > 0) {
                    document.getElementById('total-calories').textContent = data.total_calories;
                    totalSection.style.display = 'block';
                } else {
                    totalSection.style.display = 'none';
                }

            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>Error loading entries</p></div>`;
            }
        }

        async function loadSummary() {

        async function loadDateDetails(dateStr) {
            const details = document.getElementById('summary-date-details');
            selectedSummaryDate = dateStr;
            details.style.display = 'block';
            details.innerHTML = '<div class="empty-state"><p>Loading date details...</p></div>';

            try {
                const response = await fetch(`${API_BASE}/log/date/${encodeURIComponent(dateStr)}`);
                const data = await response.json();

                if (!data.entries || data.entries.length === 0) {
                    details.innerHTML = `<div class="empty-state"><p>No entries found for ${formatDate(dateStr)}</p></div>`;
                    return;
                }

                const rows = data.entries.map(entry => {
                    const calories = entry.calories ? `${entry.calories} cal` : '—';
                    const entryTime = formatEntryTime(entry.created_at);
                    const foodLabel = entryTime ? `${entry.food_name} · ${entryTime}` : entry.food_name;
                    return `
                        <div class="detail-item">
                            <div class="detail-food">${foodLabel}</div>
                            <div class="detail-actions">
                                <div class="detail-calories">${calories}</div>
                                <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');

                details.innerHTML = `
                    <h3 class="section-title">${formatDate(dateStr)} Details</h3>
                    ${rows}
                    <div class="total-section" style="margin-top: 12px;">
                        <span class="total-label">Total Calories</span>
                        <span class="total-value">${data.total_calories}</span>
                    </div>
                `;
            } catch (error) {
                details.innerHTML = '<div class="empty-state"><p>Error loading date details</p></div>';
            }
        }

        function applySummaryRange() {
            const details = document.getElementById('summary-date-details');
            details.style.display = 'none';
            loadSummary();
        }

        // Delete an entry
        async function deleteEntry(entryId) {
            if (!confirm('Delete this entry?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/log/${entryId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete entry');
                }

                // Reload today's entries
                loadTodayEntries();
                loadSummary();
                if (selectedSummaryDate) {
                    loadDateDetails(selectedSummaryDate);
                }

            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Submit clarification answer
        async function submitClarification() {
            const card = document.getElementById('clarification-card');
            const answer = document.getElementById('clarification-answer');
            const status = document.getElementById('clarify-status');
            const button = document.getElementById('clarify-button');
            const pendingId = card.dataset.pendingId;
            const text = answer.value.trim();

            if (button.disabled) {
                return;
            }

            if (!text) {
                status.textContent = 'Please provide an answer';
                status.className = 'status-message error';
                return;
            }

            button.disabled = true;
            button.textContent = 'Submitting...';
            setStatus(status, 'Submitting clarification...', 'info');

            try {
                const response = await fetch(`${API_BASE}/clarify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        pending_id: parseInt(pendingId),
                        answer: text
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit clarification');
                }

                const data = await response.json();

                if (data.status === 'resolved') {
                    status.textContent = '✓ Entry logged successfully!';
                    status.className = 'status-message success';
                    card.style.display = 'none';
                    document.getElementById('food-input').value = '';
                    setTimeout(() => {
                        document.querySelectorAll('.tab')[1].click();
                    }, 1000);
                } else if (data.status === 'needs_clarification') {
                    setStatus(status, data.message || 'More details are needed', 'info');
                    document.getElementById('clarification-question').textContent = data.question;
                } else if (data.status === 'unresolved') {
                    showManualCard(data);
                    showStatus('Automatic matching reached its limit. Please enter a manual estimate.', 'info');
                } else {
                    setStatus(status, 'Unexpected response from server', 'error');
                }

            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.className = 'status-message error';
            } finally {
                button.disabled = false;
                button.textContent = 'Continue';
            }
        }

        async function submitManualEstimate() {
            const card = document.getElementById('manual-card');
            const status = document.getElementById('manual-status');
            const caloriesInput = document.getElementById('manual-calories');
            const button = document.getElementById('manual-button');
            const pendingId = parseInt(card.dataset.pendingId);
            const calories = parseInt(caloriesInput.value, 10);

            if (button.disabled) {
                return;
            }

            if (!calories || calories <= 0) {
                status.textContent = 'Please enter a valid calorie estimate';
                status.className = 'status-message error';
                return;
            }

            button.disabled = true;
            button.textContent = 'Saving...';
            setStatus(status, 'Saving manual estimate...', 'info');

            try {
                const response = await fetch(`${API_BASE}/manual-estimate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        pending_id: pendingId,
                        calories: calories
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to save manual estimate');
                }

                const data = await response.json();
                status.textContent = `✓ Saved manual estimate (${data.calories} cal)`;
                status.className = 'status-message success';
                card.style.display = 'none';
                document.getElementById('food-input').value = '';
                setTimeout(() => {
                    document.querySelectorAll('.tab')[1].click();
                }, 1000);
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.className = 'status-message error';
            } finally {
                button.disabled = false;
                button.textContent = 'Save Estimate';
            }
        }

        // Helper: Format date nicely
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return 'Today';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            }
        }

        // Allow Enter key to submit (with Shift+Enter for new line)
        document.getElementById('food-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (e.repeat) {
                    return;
                }
                logFood();
            }
        });

        document.getElementById('clarification-answer').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.repeat) {
                    return;
                }
                submitClarification();
            }
        });

        document.getElementById('manual-calories').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.repeat) {
                    return;
                }
                submitManualEstimate();
            }
        });

        initializeSummaryDateRange();
    </script>
